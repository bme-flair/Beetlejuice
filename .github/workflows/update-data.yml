name: Update brightness data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch AAVSO observations
        run: python scripts/fetch_aavso.py --lookback-days 365 --target "alf Ori" --requested-bands "Vis,V" --summary-band "Vis"

      - name: Commit data changes
        run: |
          if [[ -n "$(git status --porcelain data/observations.json data/observations.csv data/daily_brightness.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/observations.json data/observations.csv data/daily_brightness.json
            git commit -m "Update brightness data"
            git push
          else
            echo "No data changes to commit."
          fi
